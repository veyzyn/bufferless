<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1b38"/>
      <stop offset="1" stop-color="#0c0b12"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a5ae0"/>
      <stop offset="1" stop-color="#1e1a4a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <!-- the mark, huge and faint, bleeding off the right edge -->
  <g fill="#fff">
    <circle cx="1150" cy="320" r="210" opacity="0.02"/>
    <circle cx="1240" cy="320" r="240" opacity="0.03"/>
    <circle cx="1350" cy="320" r="270" opacity="0.045"/>
  </g>
  <!-- app icon -->
  <g transform="translate(110 200)">
    <rect width="240" height="240" rx="56" fill="url(#tile)"/>
    <rect x="2" y="2" width="236" height="236" rx="54" fill="none" stroke="#fff" stroke-opacity="0.14" stroke-width="4"/>
    <circle cx="78.8" cy="120" r="33.8" fill="#fff" opacity="0.16"/>
    <circle cx="108.8" cy="120" r="38.3" fill="#fff" opacity="0.38"/>
    <circle cx="144.4" cy="120" r="43.1" fill="#fff"/>
  </g>
  <g font-family="Segoe UI, system-ui, -apple-system, sans-serif">
    <text x="410" y="318" font-size="112" font-weight="700" fill="#fff" letter-spacing="-2">bufferless</text>
    <text x="414" y="378" font-size="36" fill="#b9b4d6">Your last 60 seconds, one hotkey away.</text>
    <g font-size="22" text-anchor="middle">
      <rect x="414" y="414" width="160" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="494" y="444" fill="#dcd8f0">55 KB build</text>
      <rect x="586" y="414" width="196" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="684" y="444" fill="#dcd8f0">no re-encoding</text>
      <rect x="794" y="414" width="150" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="869" y="444" fill="#dcd8f0">no overlay</text>
      <rect x="956" y="414" width="190" height="46" rx="23" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="1051" y="444" fill="#dcd8f0">Windows 10/11</text>
    </g>
    <text x="640" y="586" font-size="22" fill="#7d78a0" text-anchor="middle">github.com/veyzyn/bufferless</text>
  </g>
</svg>
