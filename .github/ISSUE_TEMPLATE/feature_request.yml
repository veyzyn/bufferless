name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Bufferless tries to stay small and simple, so not every idea will make it in.
        It still helps to hear what people want!
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or situation, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
      description: How would you like it to work?
